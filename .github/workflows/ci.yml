name: CI - TaskHub API

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENV: test
      PYTHONPATH: ${{ github.workspace }}
      # Branch-aware backend selection
      BACKEND: ${{ (github.ref == 'refs/heads/main-sql' || github.base_ref == 'main-sql') && 'postgres' || 'mongo' }}


    services:
      # ----------------------------
      # MongoDB (main branch)
      # ----------------------------
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        # if: env.BACKEND == 'mongo'  # NOTE: GitHub Actions does not support 'if' under services


      # ----------------------------
      # PostgreSQL (main-sql branch)
      # ----------------------------
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: taskhub
          POSTGRES_DB: taskhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taskhub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        # if: env.BACKEND == 'postgres'  # NOTE: GitHub Actions does not support 'if' under services

      # ----------------------------
      # Redis (Celery broker) - safe CI dependency
      # ----------------------------
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff

      # ----------------------------
      # Formatting & linting
      # ----------------------------
      - name: Format check (Black)
        run: black --check .

      - name: Lint (Ruff)
        run: ruff check .

      # ----------------------------
      # Environment configuration
      # ----------------------------
      - name: Create test .env
        run: |
          echo "APP_NAME=taskhub-api" >> .env
          echo "APP_ENV=test" >> .env
          echo "APP_DEBUG=false" >> .env
          echo "ENV=test" >> .env
          echo "JWT_SECRET=ci_test_secret_key" >> .env
          echo "JWT_ALGORITHM=HS256" >> .env
          echo "JWT_EXPIRE_MINUTES=30" >> .env
          echo "REDIS_BROKER=redis://localhost:6379/0" >> .env


          if [ "$BACKEND" = "mongo" ]; then
            echo "MONGODB_URI=mongodb://localhost:27017" >> .env
            echo "MONGODB_DB=test_db" >> .env
          else
            echo "DATABASE_URL=postgresql+asyncpg://taskhub:taskhub@localhost:5432/taskhub" >> .env
          fi

      - name: Show backend mode
        run: echo "🧪 Running CI with BACKEND=$BACKEND"

      # ----------------------------
      # Tests (Celery mocked)
      # ----------------------------
      - name: Run tests
        run: |
          pytest -v app/tests --disable-warnings
      - name: Build image (CI)
        run: docker build -t taskhub:${{ github.sha }} .