# .github/workflows/ci.yml
# =============================================================================
# ci.yml — Continuous Integration (Test + Validate only)
#
# WHY SPLIT FROM deploy.yml?
#   - CI runs on EVERY push to EVERY branch — fast feedback, no AWS creds needed
#   - Deploy runs ONLY on devops-sql-aws — slow, needs secrets, touches production
#   - Separation makes both files easier to debug and reason about
#
# JOBS:
#   1. test      — black, ruff, pytest with real PostgreSQL + Redis
#   2. terraform — fmt check + validate (no backend, no AWS credentials)
# =============================================================================

name: CI — Test & Validate

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "devops-sql-aws"
      - "sql-aws"

jobs:

  # ===========================================================================
  # Job 1: Test
  # ===========================================================================
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest

    env:
      ENV: test
      PYTHONPATH: ${{ github.workspace }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: taskhub
          POSTGRES_DB: taskhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taskhub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff

      - name: Format check (Black)
        run: black --check .

      - name: Lint (Ruff)
        run: ruff check .

      - name: Create test .env
        run: |
          echo "APP_NAME=taskhub-api"                                                     >> .env
          echo "APP_ENV=test"                                                              >> .env
          echo "APP_DEBUG=false"                                                           >> .env
          echo "ENV=test"                                                                  >> .env
          echo "JWT_SECRET=ci_test_secret_key"                                            >> .env
          echo "JWT_ALGORITHM=HS256"                                                       >> .env
          echo "JWT_EXPIRE_MINUTES=30"                                                     >> .env
          echo "REDIS_BROKER=redis://localhost:6379/0"                                    >> .env
          echo "DATABASE_URL=postgresql+asyncpg://taskhub:taskhub@localhost:5432/taskhub" >> .env

      - name: Run tests
        run: pytest -v app/tests --disable-warnings

  # ===========================================================================
  # Job 2: Terraform validate
  # -backend=false skips S3 remote state (no AWS creds needed in CI)
  # ===========================================================================
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
