# k8s/configmap.yaml
# =============================================================================
# k8s/configmap.yaml — Non-sensitive environment variables
#
# WHY CONFIGMAP NOT SECRET?
#   ConfigMap = non-sensitive config (app name, log level, feature flags)
#   Secret    = sensitive data (passwords, tokens, API keys)
#
# Rule: if you'd be comfortable committing the value to Git, it's a ConfigMap.
#       If not, it's a Secret.
#
# INTERVIEW ANSWER:
#   "ConfigMaps store non-sensitive config that pods consume as env vars
#    or mounted files. Secrets store sensitive data — base64 encoded,
#    and ideally backed by an external secrets manager like AWS Secrets Manager
#    via the External Secrets Operator."
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskhub-config
  namespace: taskhub
  labels:
    app: taskhub
    managed-by: kubectl
data:
  APP_NAME: "taskhub-api"
  APP_ENV: "production"
  APP_DEBUG: "false"
  ENV: "production"
  PORT: "8000"
  AWS_REGION: "eu-central-1"
  EVENT_BUS_NAME: "default"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "15"
  JWT_REFRESH_DAYS: "7"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE_SECONDS: "1800"
